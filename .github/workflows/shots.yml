name: site-shots
on:
  push:
    branches: [site-shots]
    paths: [url.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node shoot.js "$(head -1 url.txt)"
      - run: |
          git config user.name site-shots && git config user.email site-shots@users.noreply.github.com
          git add out && git commit -m "shots $(date -u +%FT%TZ)" && git push
