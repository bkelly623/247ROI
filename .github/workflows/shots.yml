name: site-shots
on:
  push:
    branches: [site-shots]
    paths: [url.txt, 'requests/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-shots
  cancel-in-progress: false
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Shoot changed requests
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD -- url.txt 'requests/*.txt' || true)
          [ -z "$changed" ] && changed="url.txt"
          for f in $changed; do
            [ -f "$f" ] || continue
            url=$(head -1 "$f" | tr -d '\r')
            if [ "$f" = "url.txt" ]; then dir=out; else dir="out/$(basename "$f" .txt)"; fi
            echo "Shooting $url -> $dir"
            node shoot.js "$url" "$dir" || echo "FAILED $url" > "$dir.failed"
          done
      - run: |
          git config user.name site-shots && git config user.email site-shots@users.noreply.github.com
          git add -A out && git commit -m "shots $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
