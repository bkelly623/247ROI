  <text x="1088" y="99" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#92c7c4">Weekly ROI Scorecard</text>

  <rect x="88" y="174" width="346" height="148" rx="18" fill="#0f2a30" stroke="#244f55"/>
  <text x="116" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#49d8c8">FIRST AI EMPLOYEE</text>
  <text x="116" y="260" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Estimator Assistant</text>
  <text x="116" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b9d6d3">Prepares quote packets before review</text>

  <rect x="464" y="174" width="236" height="148" rx="18" fill="#0f2a30" stroke="#244f55"/>
  <text x="492" y="217" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#49d8c8">OWNER HOURS</text>
  <text x="492" y="268" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff">12.5</text>
  <text x="492" y="298" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b9d6d3">saved this week</text>

  <rect x="730" y="174" width="236" height="148" rx="18" fill="#0f2a30" stroke="#244f55"/>
  <text x="758" y="217" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#49d8c8">WORK PRODUCT</text>
  <text x="758" y="268" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff">31</text>
  <text x="758" y="298" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b9d6d3">packets prepared</text>

  <rect x="996" y="174" width="316" height="148" rx="18" fill="#11271f" stroke="#476330"/>
  <text x="1024" y="217" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f6c867">APPROVAL QUEUE</text>
  <text x="1024" y="268" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff">7</text>
  <text x="1024" y="298" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#d8d1ad">pricing decisions for humans</text>

  <rect x="88" y="372" width="376" height="392" rx="22" fill="#0b2228" stroke="#244f55"/>
  <text x="118" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Workflow Queue</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="118" y="456" width="316" height="70" rx="14" fill="#102f36"/>
    <text x="142" y="485" font-size="17" font-weight="700" fill="#effdf9">New roof repair request</text>
    <text x="142" y="511" font-size="15" fill="#a7c6c3">Missing slope photos requested</text>
    <rect x="118" y="546" width="316" height="70" rx="14" fill="#102f36"/>
