    <circle cx="552" cy="535" r="9" fill="#49d8c8"/>
    <text x="578" y="541" fill="#effdf9">Missing inputs requested automatically</text>
    <circle cx="552" cy="595" r="9" fill="#49d8c8"/>
    <text x="578" y="601" fill="#effdf9">Packet, checklist, or summary prepared</text>
    <circle cx="552" cy="655" r="9" fill="#f6c867"/>
    <text x="578" y="661" fill="#effdf9">Human approves pricing and exceptions</text>
    <circle cx="552" cy="715" r="9" fill="#49d8c8"/>
    <text x="578" y="721" fill="#effdf9">Scorecard updates after outcome</text>
  </g>

  <rect x="946" y="372" width="366" height="392" rx="22" fill="#0b2228" stroke="#244f55"/>
  <text x="976" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Systems Connected</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
    <rect x="976" y="462" width="132" height="54" rx="14" fill="#102f36" stroke="#28545b"/>
    <text x="1016" y="496" fill="#effdf9">CRM</text>
    <rect x="1138" y="462" width="132" height="54" rx="14" fill="#102f36" stroke="#28545b"/>
    <text x="1174" y="496" fill="#effdf9">Email</text>
    <rect x="976" y="544" width="132" height="54" rx="14" fill="#102f36" stroke="#28545b"/>
    <text x="1018" y="578" fill="#effdf9">SMS</text>
    <rect x="1138" y="544" width="132" height="54" rx="14" fill="#102f36" stroke="#28545b"/>
    <text x="1168" y="578" fill="#effdf9">Docs</text>
    <rect x="976" y="626" width="132" height="54" rx="14" fill="#102f36" stroke="#28545b"/>
    <text x="1000" y="660" fill="#effdf9">Calendar</text>
    <rect x="1138" y="626" width="132" height="54" rx="14" fill="#102f36" stroke="#28545b"/>
    <text x="1169" y="660" fill="#effdf9">Portal</text>
  </g>
  <path d="M1020 724 H1268" stroke="#49d8c8" stroke-width="8" stroke-linecap="round"/>
  <path d="M1020 724 H1194" stroke="#f6c867" stroke-width="8" stroke-linecap="round"/>
  <text x="976" y="754" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#a7c6c3">More connected tools means a clearer job spec, not more chaos.</text>
