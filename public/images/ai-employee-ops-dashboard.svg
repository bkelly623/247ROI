<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">247ROI AI employee operations dashboard</title>
  <desc id="desc">A sample AI employee dashboard showing workflow queues, human approval steps, and ROI scorecard metrics.</desc>
  <rect width="1400" height="900" fill="#061316"/>
  <rect x="48" y="48" width="1304" height="804" rx="28" fill="#0b1c21" stroke="#214148" stroke-width="2"/>
  <rect x="48" y="48" width="1304" height="86" rx="28" fill="#10272d"/>
  <rect x="48" y="105" width="1304" height="29" fill="#10272d"/>
