    <text x="142" y="601" font-size="15" fill="#a7c6c3">Deadline and spec risks extracted</text>
    <rect x="118" y="636" width="316" height="70" rx="14" fill="#102f36"/>
    <text x="142" y="665" font-size="17" font-weight="700" fill="#effdf9">Stale estimate reply</text>
    <text x="142" y="691" font-size="15" fill="#a7c6c3">Customer asked for alternate window</text>
  </g>

  <rect x="506" y="372" width="398" height="392" rx="22" fill="#0b2228" stroke="#244f55"/>
  <text x="536" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">AI Employee Handoff</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17">
    <circle cx="552" cy="475" r="9" fill="#49d8c8"/>
